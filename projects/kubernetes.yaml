project_id: "kubernetes"
project_display_name: "Kubernetes"

# SonarQube was run on a shallow clone of kubernetes/kubernetes v1.29.3 (Dec 2023).
# Both date bounds are null: SonarQube creationDate reflects when the analysis ran (today),
# so any date filter would return 0 issues. GitHub/SATD time window set separately below
# if needed; for now extraction is SonarQube-only.
time_period:
  start_date: null
  end_date: null

sonarqube:
  host: "http://localhost:9000"
  project_key: "kubernetes"
  token: "squ_53121277353daf94c6ddc80d0e33ff5ff5de26d1"
  # go:S100 (function naming conventions) produces 11,292 MINOR code smells — pure noise
  # for defect prioritisation. Limiting to BLOCKER/CRITICAL/MAJOR keeps 6,785 actionable issues.
  severities: "BLOCKER,CRITICAL,MAJOR"

github:
  repo_owner: "kubernetes"
  repo_name: "kubernetes"
  branch: "master"

components:
  run_sonarqube: true
  run_github_churn: true
  run_satd: true
  run_llm_ranking: true
